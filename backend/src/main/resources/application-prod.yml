# 배포(Railway) 프로파일 (docs/13 §2·§3). 값은 전부 환경변수 주입 — 비밀값을 이 파일에 넣지 않는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # 운영에서 스키마 자동 변경 금지 (docs/13 §4)
    show-sql: false

fabwatch:
  jwt:
    secret: ${JWT_SECRET}
    access-exp-minutes: ${JWT_ACCESS_EXP_MIN:30}
    refresh-exp-days: ${JWT_REFRESH_EXP_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    enabled: false            # 시연 데이터 중복 생성 방지 (docs/13 §4·§7)

logging:
  level:
    root: INFO
    com.fabwatch: INFO
