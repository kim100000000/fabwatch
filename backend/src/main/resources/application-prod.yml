# 배포(AWS EC2 + docker compose) 프로파일 (docs/13). 값은 전부 환경변수 주입 — 비밀값을 이 파일에 넣지 않는다.
# 활성화: SPRING_PROFILES_ACTIVE=prod (기본 프로파일이 없으므로 반드시 명시해야 한다)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # 운영에서 스키마 자동 변경 금지. 스키마는 Flyway(db/migration)가 만든다 — 엔티티 변경 시 V2__*.sql 추가
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true   # 마이그레이션 파일이 jar에 빠졌는데 조용히 넘어가 빈 DB로 뜨는 사고 방지
    baseline-on-migrate: false        # 비어 있지 않은 임의의 DB에 V1을 건너뛰고 붙지 않는다(빈 DB 또는 Flyway 관리 DB만)

server:
  # 앞단 리버스 프록시(Caddy) 뒤에서 X-Forwarded-* 를 반영한다(로그인 레이트 리밋이 실제 클라이언트 IP로 동작).
  # 기본 native = Tomcat RemoteIpValve: 요청을 보낸 직전 홉(소켓 주소)이 내부 프록시 대역(기본 10/8·172.16/12·192.168/16·127/8 —
  # docker 브리지 172.x 포함)일 때만 X-Forwarded-For 를 신뢰하고, 오른쪽부터 읽어 "첫 번째 비신뢰 주소"를 클라이언트로 본다.
  # → 클라이언트가 왼쪽에 끼워 넣은 위조 XFF는 무시된다. Caddy가 XFF를 덮어쓰든(기본) 덧붙이든 실제 클라이언트 IP가 잡힌다.
  # 신뢰 범위 전제: 백엔드가 사설 대역의 프록시(Caddy)에서만 요청을 받을 것 — 백엔드 포트를 호스트/외부에 publish하지 않는다.
  # 환경변수 SERVER_FORWARD_HEADERS_STRATEGY=framework 로 바꿀 수 있으나, framework는 XFF 가장 왼쪽 값을 검증 없이 믿어 위조에 취약하다.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

fabwatch:
  jwt:
    secret: ${JWT_SECRET:}    # 필수. 비었거나 32바이트 미만이면 기동 실패(JwtProperties)
    access-exp-minutes: ${JWT_ACCESS_EXP_MIN:30}
    refresh-exp-days: ${JWT_REFRESH_EXP_DAYS:14}
    refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}
  cors:
    # 같은 도메인 프록시(/api)면 사실상 불필요하지만 설정은 유지. 값은 배포 도메인 Origin (콤마 구분, `*` 금지)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    enabled: false            # 시연 데이터는 운영에 넣지 않는다. 설비/라인은 ADMIN이 화면에서 등록 (docs/13 §4·§7)
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}   # 포트폴리오 데모 기본 on. 데이터 생성을 끄려면 false

logging:
  level:
    root: INFO
    com.fabwatch: INFO
