# 공통 설정 (docs/13 §2). 프로파일별 값은 application-{local|prod}.yml에서 override.
spring:
  application:
    name: fabwatch
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # DB는 UTC 저장 (docs/03 F-7)
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false   # 응답 시각은 ISO-8601 UTC 문자열
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}

# 헬스체크만 공개, 나머지 actuator 엔드포인트는 비노출 (docs/13 §6)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fabwatch:
  jwt:
    secret: ${JWT_SECRET}
    access-exp-minutes: ${JWT_ACCESS_EXP_MIN:30}
    refresh-exp-days: ${JWT_REFRESH_EXP_DAYS:14}
  cors:
    # `*` 금지 — 허용 Origin만 (docs/11 §4)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: false

logging:
  level:
    com.fabwatch: INFO
