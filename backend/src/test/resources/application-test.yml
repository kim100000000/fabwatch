# 테스트 프로파일 (docs/13 §2) — 로컬 MySQL 없이 H2 인메모리로 돌린다.
# MODE=MySQL: 백틱 인용 식별자 등 MySQL 문법 호환 / NON_KEYWORDS=VALUE: sensor_data.value 컬럼명 사용
# DB 이름은 ${random.uuid}로 컨텍스트마다 고유하게 만든다 — 같은 이름의 H2를 여러 Spring 테스트 컨텍스트가 공유하면
# create-drop이 다른 컨텍스트의 스키마/시드를 날려 실행 순서에 따라 로그인 401이 간헐 발생한다 (QA M-2).
spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

fabwatch:
  jwt:
    secret: fabwatch-test-secret-key-0123456789-0123456789-0123456789
    # 테스트는 회전된 토큰 즉시 무효를 기본으로 검증한다. 유예(grace)는 전용 테스트가 속성으로 켠다
    refresh-grace-seconds: 0
  security:
    rate-limit:
      # 여러 통합 테스트가 한 컨텍스트(=한 IP 127.0.0.1)에서 수십 번 로그인하므로 기본 테스트에선 사실상 끈다. 전용 테스트가 낮춘다
      auth-per-minute: 100000
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: false
  sse:
    # 통합 테스트의 결정성 — SSE를 호출 스레드에서 동기 전송한다. 비동기 경로는 전용 단위 테스트가 직접 검증한다
    async: false
  sensor:
    retention:
      chunk-pause-ms: 0   # 삭제 배치 청크 사이 대기 제거
  ai:
    # 테스트는 외부 네트워크를 절대 호출하지 않는다 (docs/12 T-3) — mock provider + 재시도 대기 0
    provider: mock
    api-key: ""
    daily-quota: 20
    retry-backoff-millis: 0
  scheduler:
    # 시간 기반 로직(2초 수집·1분 집계·30초 heartbeat)은 스케줄러를 끄고 서비스 메서드를 직접 호출해 검증한다
    enabled: false

logging:
  level:
    com.fabwatch: INFO
