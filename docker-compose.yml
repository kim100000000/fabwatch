version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: fabwatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fabwatch
      MYSQL_ROOT_PASSWORD: fabwatch_root_local
      MYSQL_USER: fabwatch
      MYSQL_PASSWORD: fabwatch_local
      TZ: UTC
    ports:
      # 호스트 3306은 로컬 MariaDB 등이 이미 점유하는 경우가 있어 3307로 노출한다.
      # 다른 포트를 쓰려면 MYSQL_HOST_PORT 환경변수로 override.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - fabwatch_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pfabwatch_root_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fabwatch_mysql_data:
